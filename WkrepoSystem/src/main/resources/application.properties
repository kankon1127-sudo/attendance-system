# Application Name
spring.application.name=wkrepo-system

# Server Configuration
server.port=8080

# セッション ID は Cookie だけで扱う（URL に ;jsessionid=... を付けない。URL から ID が漏れるのを防ぐ）
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true

# H2 Database Configuration
# APP_DATA_DIR を指定するとデータベースの保存先を変更できます（Render Persistent Disk 等）。
# 未指定時はプロジェクトの data/ を使用します。
# AUTO_SERVER は使わない。target 配下に置かないので compile / clean しても消えない
spring.datasource.url=jdbc:h2:file:./data/wkreposystem;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Locale messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# 36協定の年度の起算月（年 360 / 720 時間、月 45 時間超は年 6 回までの集計に使用）
app.agreement36.year-start-month=4

# 交通費・諸経費の 1 件あたりの上限金額（円）。0 にすると上限なし（0 円以下の申請は常に不可）
app.expense.max-amount=50000

# 定期リマインド（お知らせ＋メール）。平日の朝 8 時に実行
app.reminder.enabled=true
app.reminder.cron=0 0 8 * * MON-FRI
# 前月の月報の未提出リマインドを始める日（以降は週 1 回）
app.reminder.monthly-report-day=3
# 当月の時間外がこの時間以上になったら本人に知らせる
app.reminder.overtime-warning-hours=40
# メール本文に入れるリンクの先頭（例：https://wkrepo.example.com）。空ならパスのみ
app.base-url=

# Admin database restore upload limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# Configure SMTP through SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, and SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH/STARTTLS_ENABLE.

# H2 Console：ログインチェックを通らないため既定では無効。dev profile（application-dev.properties）でのみ有効にする
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.wkrepo.system=DEBUG
