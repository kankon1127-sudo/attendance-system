# Application Name
spring.application.name=wkrepo-system

# Server Configuration
server.port=8080

# H2 Database Configuration
# 実体はプロジェクトの data/wkreposystem （H2DataLocationEnvironmentPostProcessor が絶対パスで上書き）
# AUTO_SERVER は使わない。target 配下に置かないので compile / clean しても消えない
spring.datasource.url=jdbc:h2:file:./data/wkreposystem;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.wkrepo.system=DEBUG
