# Application Name
spring.application.name=wkrepo-system

# Server Configuration
server.port=8080

# H2 Database Configuration
# APP_DATA_DIR を指定するとデータベースの保存先を変更できます（Render Persistent Disk 等）。
# 未指定時はプロジェクトの data/ を使用します。
# AUTO_SERVER は使わない。target 配下に置かないので compile / clean しても消えない
spring.datasource.url=jdbc:h2:file:./data/wkreposystem;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Locale messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Admin database restore upload limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# Configure SMTP through SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, and SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH/STARTTLS_ENABLE.

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.wkrepo.system=DEBUG
