<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main-content}, 'paid-leave', '年休取得')}">
<head th:fragment="head">
    <title th:text="${#messages.msg('page.paid-leave') + ' - ' + #messages.msg('brand.name')}">年休取得</title>
    <style>
        .stat-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 767.98px) {
            .stat-cards {
                flex-direction: column;
            }
            .content-wrapper {
                padding: 16px;
            }
            .form-header {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .form-row {
                flex-direction: column;
                gap: 12px;
            }
            .tab-group {
                flex-direction: column;
                width: 100%;
            }
            .tab {
                width: 100%;
                min-height: 44px;
                justify-content: center;
            }
            .btn-submit {
                width: 100%;
                min-height: 44px;
            }
        }
        .stat-card {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .stat-card.blue {
            border-top: 4px solid #3b82f6;
        }
        .stat-card.green {
            border-top: 4px solid #22c55e;
        }
        .stat-card.orange {
            border-top: 4px solid #f59e0b;
        }
        .stat-card.purple {
            border-top: 4px solid #8b5cf6;
        }
        .stat-label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .stat-value.blue {
            color: #3b82f6;
        }
        .stat-value.green {
            color: #22c55e;
        }
        .stat-value.orange {
            color: #f59e0b;
        }
        .stat-value.purple {
            color: #8b5cf6;
        }
        .stat-unit {
            font-size: 16px;
            color: #64748b;
        }
        .stat-sub {
            font-size: 12px;
            color: #94a3b8;
        }
        .content-wrapper {
            background: #f1f5f9;
            padding: 30px;
            border-radius: 16px;
        }
        .leave-form-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 2px solid #e2e8f0;
        }
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .form-title {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: #3b82f6;
            border-radius: 2px;
        }
        .tab-group {
            display: flex;
            gap: 8px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            background: #f1f5f9;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab.active {
            background: #3b82f6;
            color: white;
        }
        .leave-form {
            max-width: 100%;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .days-calculation {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            color: #475569;
        }
        .days-calculation .days-value {
            font-size: 20px;
            font-weight: bold;
            color: #3b82f6;
        }
        .btn-submit {
            background: #94a3b8;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit.active {
            background: #3b82f6;
        }
        .btn-submit.active:hover {
            background: #2563eb;
        }
        .btn-submit:disabled {
            cursor: not-allowed;
        }
        .history-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #e2e8f0;
        }
        .history-title {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a5f;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: #1e3a5f;
            border-radius: 2px;
        }
        .history-empty {
            color: #94a3b8;
            font-size: 16px;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }
        .history-table th, .history-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .history-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
        }
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .required {
            color: #ef4444;
        }
    </style>
</head>
<body>
<th:block th:fragment="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a class="btn btn-outline-secondary" th:href="@{/paid-leave(year=${year - 1})}">
            <i class="bi bi-chevron-left"></i>
            <span th:text="#{common.previousYear}">前年</span>
        </a>
        <h4 class="mb-0" th:text="${year} + #{common.year}">2026年</h4>
        <a class="btn btn-outline-secondary" th:href="@{/paid-leave(year=${year + 1})}">
            <span th:text="#{common.nextYear}">次年</span>
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>
    <div class="alert alert-success" th:if="${entitlementSaved}" th:text="#{leave.entitlementSaved}"></div>
    <div class="alert alert-danger" th:if="${entitlementError}" th:text="${entitlementError}"></div>
    <div class="alert alert-danger" th:if="${leaveError}" th:text="${#messages.msg(leaveError)}"></div>
    <div class="alert alert-success" th:if="${notificationStatus == 'SENT'}"
         th:text="${#messages.msg('notification.' + #strings.toLowerCase(notificationStatus))}"></div>
    <div class="alert alert-warning" th:if="${notificationStatus != null and notificationStatus != 'SENT' and notificationStatus != 'NOT_APPLICABLE'}"
         th:text="${#messages.msg('notification.' + #strings.toLowerCase(notificationStatus))}"></div>
    <div class="stat-cards">
        <div class="stat-card blue">
            <div class="stat-label" th:text="#{leave.grantedDays}">付与日数</div>
            <div class="stat-value blue" th:text="${grantedDays} + #{common.daysUnit}">20日</div>
        </div>
        <div class="stat-card green">
            <div class="stat-label" th:text="#{leave.usedDays}">取得済み日数</div>
            <div class="stat-value green" th:text="${usedDays} + #{common.daysUnit}">0日</div>
        </div>
        <div class="stat-card orange">
            <div class="stat-label" th:text="#{leave.remainingDays}">年休残日数</div>
            <div class="stat-value orange" th:text="${remainingDays} + #{common.daysUnit}">20日</div>
        </div>
        <div class="stat-card purple">
            <div class="stat-label" th:text="#{leave.pendingDays}">承認待ち</div>
            <div class="stat-value purple" th:text="${pendingDays} + #{common.daysUnit}">0日</div>
        </div>
    </div>

    <div class="history-card mb-4" th:if="${canManageEntitlements}">
        <div class="history-title" th:text="#{leave.entitlementManagement}">年休付与日数の設定</div>
        <p class="text-muted" th:text="#{leave.entitlementHelp}">社員ごとに対象年の年休付与日数を設定してください。</p>
        <div class="table-responsive">
            <table class="history-table">
                <thead>
                    <tr>
                        <th th:text="#{user.employeeId}">社員番号</th>
                        <th th:text="#{user.name}">氏名</th>
                        <th th:text="#{user.department}">部署</th>
                        <th th:text="#{leave.grantedDays}">付与日数</th>
                        <th th:text="#{common.operation}">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entitlement : ${entitlements}">
                        <td th:text="${entitlement.employeeId}">EMP001</td>
                        <td th:text="${entitlement.name}">社員名</td>
                        <td th:text="${entitlement.department}">部署</td>
                        <td colspan="2">
                            <form method="post" th:action="@{/paid-leave/entitlement}"
                                  class="d-flex align-items-center gap-2">
                                <input type="hidden" name="userId" th:value="${entitlement.userId}">
                                <input type="hidden" name="year" th:value="${year}">
                                <input type="number" name="grantedDays" class="form-control"
                                       min="0" max="365" step="0.1" required
                                       th:value="${entitlement.grantedDays}" style="max-width:120px;">
                                <button type="submit" class="btn btn-outline-primary" th:text="#{common.save}">保存</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="leave-form-card">
            <div class="form-header">
                <div class="form-title" th:text="#{page.paid-leave}">年休申請</div>
                <div class="tab-group">
                    <button class="tab active">
                        <span>📝</span> <span th:text="#{leave.normalApplication}">通常申請</span>
                    </button>
                    <button class="tab">
                        <span>📁</span> <span th:text="#{leave.pastRegistration}">過去取得登録</span>
                    </button>
                </div>
            </div>

            <form class="leave-form" method="POST" action="/paid-leave/save" th:object="${newLeave}">
                <div class="form-row">
                    <div class="form-group">
                    <label for="startDate"><span th:text="#{leave.startDate}">取得開始日</span> <span class="required">*</span></label>
                    <input type="date" id="startDate" name="startDate" required>
                </div>
                <div class="form-group">
                    <label for="endDate" th:text="#{leave.endDate}">取得終了日</label>
                    <input type="date" id="endDate" name="endDate">
                </div>
                <div class="form-group">
                    <label for="leaveType" th:text="#{leave.type}">区分</label>
                    <select id="leaveType" name="leaveType">
                        <option value="全日" th:text="#{leave.type.fullDay}">全日</option>
                        <option value="午前" th:text="#{leave.type.morning}">午前</option>
                        <option value="午後" th:text="#{leave.type.afternoon}">午後</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="remarks" th:text="#{leave.reason}">理由（任意）</label>
                <textarea id="remarks" name="remarks" th:placeholder="#{leave.reason}"></textarea>
            </div>

            <div class="days-calculation">
                <span th:text="#{leave.plannedDays}">取得予定日数：</span>
                <span class="days-value" id="calculatedDays" th:data-day-unit="#{common.daysUnit}">—</span>
            </div>
            <div class="alert alert-warning d-none" id="dateValidationMessage"
                 th:data-half-day-message="#{leave.application.halfDaySingleDate}"
                 th:data-invalid-date-message="#{leave.application.invalidDate}"></div>

            <button type="submit" class="btn-submit" id="submitBtn" disabled th:text="#{leave.apply}">申請する</button>
        </form>
    </div>

    <div class="history-card">
        <div class="history-title" th:text="#{leave.history}">申請履歴</div>
        <div th:if="${leaves.empty}" class="history-empty">
            <span th:text="#{leave.emptyHistory}">年休申請はまだありません</span>
        </div>
        <div class="table-responsive">
            <table th:if="${!leaves.empty}" class="history-table">
            <thead>
                <tr>
                    <th th:text="#{leave.startDate}">取得開始日</th>
                    <th th:text="#{leave.endDate}">取得終了日</th>
                    <th th:text="#{leave.type}">区分</th>
                    <th th:text="#{leave.days}">日数</th>
                    <th th:text="#{application.status}">ステータス</th>
                    <th th:text="#{leave.reason}">理由</th>
                    <th th:text="#{common.operation}">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="leave : ${leaves}">
                    <td th:text="${#temporals.format(leave.startDate, 'yyyy/MM/dd')}">2024/01/01</td>
                    <td th:text="${#temporals.format(leave.endDate, 'yyyy/MM/dd')}">2024/01/01</td>
                    <td th:text="${leave.leaveType == '全日' ? #messages.msg('leave.type.fullDay') : (leave.leaveType == '午前' ? #messages.msg('leave.type.morning') : (leave.leaveType == '午後' ? #messages.msg('leave.type.afternoon') : leave.leaveType))}">全日</td>
                    <td th:text="${leave.leaveDays} + #{common.daysUnit}">1日</td>
                    <td th:text="${#messages.msg('application.status.' + (leave.status != null ? leave.status.name() : 'PENDING'))}">申請中</td>
                    <td th:text="${leave.remarks}">理由</td>
                    <td>
                        <form th:action="@{/paid-leave/delete/{id}(id=${leave.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn-delete" onclick="return confirm('削除してもよろしいですか？');">
                                <span th:text="#{common.delete}">削除</span>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const leaveTypeInput = document.getElementById('leaveType');
    const calculatedDaysSpan = document.getElementById('calculatedDays');
    const submitBtn = document.getElementById('submitBtn');
    const dateValidationMessage = document.getElementById('dateValidationMessage');
    const dayUnit = calculatedDaysSpan.dataset.dayUnit;
    
    function calculateDays() {
        const startDate = startDateInput.value;
        const endDate = endDateInput.value || startDate;

        if (!startDate) {
            calculatedDaysSpan.textContent = '—';
            submitBtn.disabled = true;
            submitBtn.classList.remove('active');
            dateValidationMessage.classList.add('d-none');
            return;
        }
        if (endDate < startDate) {
            calculatedDaysSpan.textContent = '—';
            submitBtn.disabled = true;
            submitBtn.classList.remove('active');
            dateValidationMessage.textContent = dateValidationMessage.dataset.invalidDateMessage;
            dateValidationMessage.classList.remove('d-none');
            return;
        }

        const halfDay = leaveTypeInput.value === '午前' || leaveTypeInput.value === '午後';
        if (halfDay && startDate !== endDate) {
            calculatedDaysSpan.textContent = '—';
            submitBtn.disabled = true;
            submitBtn.classList.remove('active');
            dateValidationMessage.textContent = dateValidationMessage.dataset.halfDayMessage;
            dateValidationMessage.classList.remove('d-none');
            return;
        }

        dateValidationMessage.classList.add('d-none');
        let days = 0.5;
        if (!halfDay) {
            const start = new Date(startDate + 'T00:00:00');
            const end = new Date(endDate + 'T00:00:00');
            days = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
        }
        calculatedDaysSpan.textContent = days + dayUnit;
        submitBtn.disabled = false;
        submitBtn.classList.add('active');
    }
    
    startDateInput.addEventListener('change', calculateDays);
    endDateInput.addEventListener('change', calculateDays);
    startDateInput.addEventListener('change', function() {
        if (!endDateInput.value || endDateInput.value < startDateInput.value) {
            endDateInput.value = startDateInput.value;
            calculateDays();
        }
    });
    leaveTypeInput.addEventListener('change', calculateDays);
</script>
</th:block>
</body>
</html>
