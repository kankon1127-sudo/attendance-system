<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main-content}, 'leave-management', '年休管理')}">
<head th:fragment="head">
    <title th:text="${#messages.msg('page.leave-management') + ' - ' + #messages.msg('brand.name')}">年休管理</title>
    <style>
        .lm-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px;
                   box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); }
        .lm-table td, .lm-table th { vertical-align: middle; white-space: nowrap; }
        .lm-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .lm-table tr.needs-action td:first-child { box-shadow: inset 4px 0 0 #dc2626; }
    </style>
</head>
<body>
<th:block th:fragment="main-content">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="lm-card">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <h5 class="mb-0">
                <span th:text="#{leave.management.title}">年休管理</span>
                <span class="badge text-bg-danger ms-1" th:if="${actionCount > 0}"
                      th:text="#{leave.management.actionCount(${actionCount})}">要対応 2 名</span>
            </h5>
            <div class="d-flex gap-2">
                <a class="btn btn-sm" th:classappend="${actionOnly} ? 'btn-primary' : 'btn-outline-primary'"
                   th:href="@{/leave-management(action=${!actionOnly})}"
                   th:text="${actionOnly} ? #{team.showAll} : #{leave.management.actionOnly}">要対応のみ</a>
                <form method="post" th:action="@{/leave-management/run}">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-repeat"></i> <span th:text="#{leave.management.runNow}">自動付与を今すぐ実行</span>
                    </button>
                </form>
            </div>
        </div>
        <p class="small text-muted" th:text="#{leave.management.hint}">入社日を基準に毎日自動で付与します。</p>

        <div class="table-responsive">
            <table class="table table-sm lm-table js-mobile-card-table">
                <thead>
                <tr>
                    <th th:text="#{user.employeeId}">社員番号</th>
                    <th th:text="#{team.member}">氏名</th>
                    <th th:text="#{user.department}">部署</th>
                    <th th:text="#{user.hireDate}">入社日</th>
                    <th th:text="#{leave.management.workPattern}">所定</th>
                    <th class="text-end" th:text="#{leave.remainingDays}">残日数</th>
                    <th th:text="#{leave.management.nextGrant}">次回付与</th>
                    <th th:text="#{leave.obligation.short}">年5日</th>
                    <th class="text-end" th:text="#{common.operation}">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}" th:classappend="${row.needsAction()} ? 'needs-action'">
                    <td th:text="${row.user().employeeId}">EMP003</td>
                    <td th:text="${row.user().name}">山田太郎</td>
                    <td th:text="${row.user().department}">開発部</td>
                    <td>
                        <span th:if="${row.user().hireDate != null}" th:text="${#temporals.format(row.user().hireDate, 'yyyy/MM/dd')}">2024/04/01</span>
                        <span th:if="${row.user().hireDate == null}" class="badge text-bg-danger" th:text="#{leave.management.noHireDate}">未登録</span>
                    </td>
                    <td>
                        <span th:if="${row.proportional()}" class="badge text-bg-info"
                              th:text="#{leave.management.proportional(${row.user().weeklyWorkDays})}">比例 週3日</span>
                        <span th:unless="${row.proportional()}" class="text-muted" th:text="#{leave.management.fullTime}">通常</span>
                    </td>
                    <td class="num fw-bold" th:text="${row.balance().remainingDays()}">11.0</td>
                    <td>
                        <span th:if="${row.nextGrant() != null}"
                              th:text="${#temporals.format(row.nextGrant().grantDate(), 'yyyy/MM/dd') + ' ' + row.nextGrant().days() + #messages.msg('common.daysUnit')}">2026/10/01 12日</span>
                        <span th:if="${row.nextGrant() == null}" class="text-muted">-</span>
                    </td>
                    <td>
                        <span th:if="${row.obligation() == null}" class="text-muted">-</span>
                        <span th:if="${row.obligation() != null}" class="badge"
                              th:classappend="${row.obligation().status().name() == 'DONE'} ? 'text-bg-success'
                                    : (${row.obligation().status().name() == 'IN_PROGRESS'} ? 'text-bg-light text-dark' : 'text-bg-danger')"
                              th:text="${#messages.msg('leave.obligation.status.' + row.obligation().status().name())}
                                    + ' ' + ${row.obligation().taken()} + '/5'">期間中 2.0/5</span>
                        <div class="small text-muted" th:if="${row.obligation() != null and row.obligation().status().name() != 'DONE'}"
                             th:text="#{leave.obligation.deadline(${#temporals.format(row.obligation().deadline(), 'yyyy/MM/dd')})}">期限 2026/09/30</div>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/leave-management/user(id=${row.user().id})}"
                           th:text="#{leave.management.detail}">付与履歴</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="small text-muted" th:text="#{leave.management.legend}">年5日：付与日数が 10 日以上の人は、付与日から 1 年以内に 5 日以上取得させる義務があります。</div>
    </div>
</th:block>
</body>
</html>
