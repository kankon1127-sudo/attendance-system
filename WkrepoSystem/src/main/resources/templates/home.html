<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main-content}, 'home', 'ホーム')}">
<head th:fragment="head">
    <title th:text="${#messages.msg('page.home') + ' - ' + #messages.msg('brand.name')}">ホーム</title>
    <style>
        .stat-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 20px;
            text-align: center;
        }
        .stat-card h4 {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
        }
        .stat-card .stat-unit {
            font-size: 14px;
            color: #7f8c8d;
        }
        .progress {
            height: 25px;
            border-radius: 12px;
        }
        .progress-bar-warning {
            background: linear-gradient(90deg, #ffc107 0%, #ff9800 100%);
        }
        .progress-bar-danger {
            background: linear-gradient(90deg, #dc3545 0%, #c0392b 100%);
        }
        .approval-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .approval-item:last-child {
            border-bottom: 0;
        }
        .approval-item-main {
            min-width: 0;
        }
        .approval-item-meta {
            color: #6c757d;
            font-size: 13px;
        }
        .trend-chart {
            display: flex;
            align-items: stretch;
            gap: 12px;
            min-height: 260px;
            padding: 18px 8px 0;
        }
        .trend-month {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }
        .trend-values {
            min-height: 34px;
            color: #64748b;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
        }
        .trend-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            width: 100%;
            height: 190px;
            border-bottom: 1px solid #dee2e6;
        }
        .trend-bar {
            width: min(28px, 38%);
            border-radius: 5px 5px 0 0;
        }
        .trend-bar.work {
            background: #3b82f6;
        }
        .trend-bar.overtime {
            background: #f59e0b;
        }
        .trend-label {
            margin-top: 8px;
            color: #64748b;
            font-size: 12px;
            white-space: nowrap;
        }
        .trend-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            color: #64748b;
            font-size: 13px;
        }
        .trend-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .trend-legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        .overtime-progress {
            height: 18px;
            border-radius: 10px;
        }
        @media (max-width: 575.98px) {
            .approval-item {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }
            .trend-chart {
                gap: 4px;
                padding-right: 0;
                padding-left: 0;
            }
            .trend-bars {
                gap: 3px;
            }
            .trend-values {
                font-size: 9px;
            }
            .trend-label {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
<th:block th:fragment="main-content">
    <!-- 统计卡片 -->
    <div class="row mb-4">
        <div class="col-12 col-md-3 mb-3">
            <div class="stat-card">
                <h4 th:text="#{attendance.workHours}">実働時間</h4>
                <div class="stat-value" th:text="${#numbers.formatDecimal(homeWorkHours, 1, 2)}">0.00</div>
                <div class="stat-unit">h</div>
            </div>
        </div>
        <div class="col-12 col-md-3 mb-3">
            <div class="stat-card">
                <h4 th:text="#{attendance.overtimeHours}">残業時間</h4>
                <div class="stat-value" th:text="${#numbers.formatDecimal(homeOvertimeHours, 1, 2)}">0.00</div>
                <div class="stat-unit">h</div>
            </div>
        </div>
        <div class="col-12 col-md-3 mb-3">
            <div class="stat-card">
                <h4 th:text="#{home.remainingLeave}">年休残日数</h4>
                <div class="stat-value" th:text="${#numbers.formatDecimal(homeRemainingLeave, 1, 1)}">0.0</div>
                <div class="stat-unit" th:text="#{common.daysUnit}">日</div>
            </div>
        </div>
        <div class="col-12 col-md-3 mb-3">
            <div class="stat-card">
                <h4 th:text="#{attendance.daysWorked}">今月出勤日数</h4>
                <div class="stat-value" th:text="${homeWorkDays}">0</div>
                <div class="stat-unit" th:text="#{common.daysUnit}">日</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
            <h4 class="mb-0" th:text="#{home.pendingApprovals}">待审批事项</h4>
            <a class="btn btn-outline-primary btn-sm text-nowrap" th:href="@{/application/list}"
               th:text="#{home.viewAllApprovals}">查看全部</a>
        </div>
        <p class="text-muted mb-3">
            <span th:text="#{home.pendingApprovalCount}">待处理</span>
            <strong th:text="${pendingApprovalCount}">0</strong>
            <span th:text="#{home.items}">项</span>
        </p>
        <div th:if="${overdueApprovalCount > 0}" class="alert alert-warning py-2" role="status">
            <i class="bi bi-exclamation-circle me-1"></i>
            <span th:text="#{home.overdueApprovalAlert(${overdueApprovalCount})}">
                有待审批事项已超过7天，请优先处理。
            </span>
        </div>
        <div th:if="${pendingApprovals.empty}" class="text-muted py-3">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="#{home.noPendingApprovals}">当前没有需要您审批的事项。</span>
        </div>
        <div th:each="approval : ${pendingApprovals}" class="approval-item">
            <div class="approval-item-main">
                <div class="fw-semibold">
                    <span th:text="${#messages.msg('application.type.' + approval.applicationType)}">申请类型</span>
                    <span class="text-muted">·</span>
                    <span th:text="${approval.applicantName}">申请人</span>
                </div>
                <div class="approval-item-meta">
                    <span th:if="${approval.applicantDepartment != null and !approval.applicantDepartment.isEmpty()}"
                          th:text="${approval.applicantDepartment}">部门</span>
                    <span th:if="${approval.applicationDate != null}"
                          th:text="${#temporals.format(approval.applicationDate, 'yyyy/MM/dd')}">日期</span>
                    <span th:if="${approval.amountLabel != null}" th:text="${approval.amountLabel}">详情</span>
                    <span th:if="${approval.overdue}" class="badge text-bg-danger"
                          th:text="#{application.overdueDays(${approval.waitingDays})}">已等待超过7天</span>
                    <span th:if="${approval.canApprove and !approval.overdue}" class="badge text-bg-light text-dark"
                          th:text="#{application.waitingDays(${approval.waitingDays})}">等待1天</span>
                </div>
            </div>
            <span class="badge text-bg-warning"
                  th:text="${#messages.msg('application.status.' + approval.status.name())}">待审批</span>
        </div>
    </div>
    
    <div class="card">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h4 class="mb-0" th:text="#{home.attendanceTrend}">考勤趋势（近6个月）</h4>
            <div class="trend-legend">
                <span class="trend-legend-item">
                    <span class="trend-legend-color" style="background:#3b82f6;"></span>
                    <span th:text="#{attendance.workHours}">实际工时</span>
                </span>
                <span class="trend-legend-item">
                    <span class="trend-legend-color" style="background:#f59e0b;"></span>
                    <span th:text="#{attendance.overtimeHours}">加班时长</span>
                </span>
            </div>
        </div>
        <div class="trend-chart" role="img" th:aria-label="#{home.attendanceTrend}">
            <div class="trend-month" th:each="month : ${homeMonthlyTrend}">
                <div class="trend-values">
                    <span th:text="${#numbers.formatDecimal(month.workHours, 1, 0)}">0</span>
                    <span>/</span>
                    <span th:text="${#numbers.formatDecimal(month.overtimeHours, 1, 0)}">0</span>
                    <span>h</span>
                </div>
                <div class="trend-bars">
                    <div class="trend-bar work"
                         th:style="'height:' + ${month.workHoursPercent} + '%'"
                         th:title="${month.workHours} + 'h'"></div>
                    <div class="trend-bar overtime"
                         th:style="'height:' + ${month.overtimeHoursPercent} + '%'"
                         th:title="${month.overtimeHours} + 'h'"></div>
                </div>
                <span class="trend-label" th:text="${month.label}">2026-10</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h4 class="mb-4" th:text="#{home.overtimeManagement}">加班时长管理</h4>
        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
            <span th:text="#{home.monthlyOvertime}">本月加班时长</span>
            <strong class="text-nowrap">
                <span th:text="${#numbers.formatDecimal(homeOvertimeHours, 1, 2)}">0.00</span>
                <span>h / </span>
                <span th:text="${#numbers.formatDecimal(homeOvertimeLimit, 1, 0)}">45</span>
                <span>h</span>
            </strong>
        </div>
        <div class="progress overtime-progress mb-3">
            <div class="progress-bar"
                 th:classappend="${homeOvertimeWarningReached ? ' bg-danger' : ' bg-success'}"
                 role="progressbar"
                 th:style="'width:' + ${homeOvertimePercent} + '%'"
                 th:aria-valuenow="${homeOvertimePercent}"
                 aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="d-flex flex-wrap justify-content-between gap-2 text-muted">
            <span>
                <span th:text="#{home.warningThreshold}">预警阈值（40小时）</span>
                <strong th:class="${homeOvertimeWarningReached ? 'text-danger' : 'text-success'}"
                        th:text="${homeOvertimeWarningReached ? #messages.msg('home.warningReached') : #messages.msg('home.warningNotReached')}">未达到</strong>
            </span>
            <span>
                <span th:text="#{home.overtimeRemaining}">距月上限剩余</span>
                <strong th:text="${#numbers.formatDecimal(homeOvertimeRemaining, 1, 2)} + 'h'">45h</strong>
            </span>
        </div>
        <div class="small text-muted mt-2" th:text="#{home.overtimeLimit}">
            月加班上限为45小时。
        </div>
    </div>
</th:block>
</body>
</html>
