<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main-content}, 'paid-leave', '年休取得')}">
<head th:fragment="head">
    <title>年休取得 - 月次業務ポータル</title>
    <style>
        .stat-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .stat-card.blue {
            border-top: 4px solid #3b82f6;
        }
        .stat-card.green {
            border-top: 4px solid #22c55e;
        }
        .stat-card.orange {
            border-top: 4px solid #f59e0b;
        }
        .stat-card.purple {
            border-top: 4px solid #8b5cf6;
        }
        .stat-label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .stat-value.blue {
            color: #3b82f6;
        }
        .stat-value.green {
            color: #22c55e;
        }
        .stat-value.orange {
            color: #f59e0b;
        }
        .stat-value.purple {
            color: #8b5cf6;
        }
        .stat-unit {
            font-size: 16px;
            color: #64748b;
        }
        .stat-sub {
            font-size: 12px;
            color: #94a3b8;
        }
        .content-wrapper {
            background: #f1f5f9;
            padding: 30px;
            border-radius: 16px;
        }
        .leave-form-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 2px solid #e2e8f0;
        }
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .form-title {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: #3b82f6;
            border-radius: 2px;
        }
        .tab-group {
            display: flex;
            gap: 8px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            background: #f1f5f9;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab.active {
            background: #3b82f6;
            color: white;
        }
        .leave-form {
            max-width: 100%;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .days-calculation {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            color: #475569;
        }
        .days-calculation .days-value {
            font-size: 20px;
            font-weight: bold;
            color: #3b82f6;
        }
        .btn-submit {
            background: #94a3b8;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit.active {
            background: #3b82f6;
        }
        .btn-submit.active:hover {
            background: #2563eb;
        }
        .btn-submit:disabled {
            cursor: not-allowed;
        }
        .history-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #e2e8f0;
        }
        .history-title {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a5f;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: #1e3a5f;
            border-radius: 2px;
        }
        .history-empty {
            color: #94a3b8;
            font-size: 16px;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }
        .history-table th, .history-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .history-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
        }
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .required {
            color: #ef4444;
        }
    </style>
</head>
<body>
<th:block th:fragment="main-content">
    <div class="stat-cards">
        <div class="stat-card blue">
            <div class="stat-label">年休残日数</div>
            <div class="stat-value blue" th:text="${remainingDays} + '日'">40日</div>
        </div>
        <div class="stat-card green">
            <div class="stat-label">取得済み日数</div>
            <div class="stat-value green" th:text="${usedDays} + '日'">0日</div>
        </div>
        <div class="stat-card orange">
            <div class="stat-label">5日義務まで</div>
            <div class="stat-value orange" th:text="${daysTo5Year} + '日'">5日</div>
        </div>
        <div class="stat-card purple">
            <div class="stat-label">付与日数</div>
            <div class="stat-value purple" th:text="${grantedDays} + '日'">20日</div>
            <div class="stat-sub">期限未設定</div>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="leave-form-card">
            <div class="form-header">
                <div class="form-title">年休申請</div>
                <div class="tab-group">
                    <button class="tab active">
                        <span>📝</span> 通常申請
                    </button>
                    <button class="tab">
                        <span>📁</span> 過去取得登録
                    </button>
                </div>
            </div>

            <form class="leave-form" method="POST" action="/paid-leave/save" th:object="${newLeave}">
                <div class="form-row">
                    <div class="form-group">
                    <label for="startDate">取得開始日 <span class="required">*</span></label>
                    <input type="date" id="startDate" name="startDate" required>
                </div>
                <div class="form-group">
                    <label for="endDate">取得終了日</label>
                    <input type="date" id="endDate" name="endDate">
                </div>
                <div class="form-group">
                    <label for="leaveType">区分</label>
                    <select id="leaveType" name="leaveType">
                        <option value="全日">全日</option>
                        <option value="午前">午前</option>
                        <option value="午後">午後</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="remarks">理由（任意）</label>
                <textarea id="remarks" name="remarks" placeholder="例：通院のため"></textarea>
            </div>

            <div class="days-calculation">
                <span>取得予定日数：</span>
                <span class="days-value" id="calculatedDays">—</span>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn" disabled>申請する</button>
        </form>
    </div>

    <div class="history-card">
        <div class="history-title">申請履歴</div>
        <div th:if="${leaves.empty}" class="history-empty">
            年休申請はまだありません
        </div>
        <table th:if="${!leaves.empty}" class="history-table">
            <thead>
                <tr>
                    <th>取得開始日</th>
                    <th>取得終了日</th>
                    <th>区分</th>
                    <th>日数</th>
                    <th>理由</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="leave : ${leaves}">
                    <td th:text="${#temporals.format(leave.startDate, 'yyyy/MM/dd')}">2024/01/01</td>
                    <td th:text="${#temporals.format(leave.endDate, 'yyyy/MM/dd')}">2024/01/01</td>
                    <td th:text="${leave.leaveType}">全日</td>
                    <td th:text="${leave.leaveDays} + '日'">1日</td>
                    <td th:text="${leave.remarks}">理由</td>
                    <td>
                        <form th:action="@{/paid-leave/delete/{id}(id=${leave.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn-delete" onclick="return confirm('削除してもよろしいですか？');">
                                削除
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const calculatedDaysSpan = document.getElementById('calculatedDays');
    const submitBtn = document.getElementById('submitBtn');
    
    function calculateDays() {
        const startDate = startDateInput.value;
        const endDate = endDateInput.value || startDate;
        
        if (startDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            const diffTime = Math.abs(end - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            calculatedDaysSpan.textContent = diffDays + '日';
            submitBtn.disabled = false;
            submitBtn.classList.add('active');
        } else {
            calculatedDaysSpan.textContent = '—';
            submitBtn.disabled = true;
            submitBtn.classList.remove('active');
        }
    }
    
    startDateInput.addEventListener('change', calculateDays);
    endDateInput.addEventListener('change', calculateDays);
    
    // 初始化时如果只有开始日期，结束日期默认等于开始日期
    startDateInput.addEventListener('change', function() {
        if (!endDateInput.value) {
            endDateInput.value = startDateInput.value;
        }
    });
</script>
</th:block>
</body>
</html>
