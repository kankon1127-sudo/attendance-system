<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main-content}, 'travel-expense', '交通費入力')}">
<head th:fragment="head">
    <title th:text="${#messages.msg('page.travel-expense') + ' - ' + #messages.msg('brand.name')}">交通費入力</title>
    <style>
        .expense-form {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: end;
        }
        .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2c3e50;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-add {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-add:hover {
            background: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-delete:hover {
            background: #c82333;
        }
        .total-section {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: right;
        }
        .total-amount {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .expense-section {
            border-left: 4px solid #3498db;
            padding-left: 0;
        }
        .expense-section.non-taxable {
            border-left-color: #28a745;
        }
        .expense-section.travel {
            border-left-color: #007bff;
        }
        .section-total {
            margin-top: 12px;
            text-align: right;
            font-weight: 600;
            color: #495057;
        }
        .grand-total {
            margin-top: 24px;
            padding: 18px;
            background: #e9ecef;
            border-radius: 8px;
            text-align: right;
        }
    </style>
</head>
<body>
<th:block th:fragment="main-content">
    <div class="alert alert-success" th:if="${notificationStatus == 'SENT'}"
         th:text="${#messages.msg('notification.' + #strings.toLowerCase(notificationStatus))}"></div>
    <div class="alert alert-warning" th:if="${notificationStatus != null and notificationStatus != 'SENT' and notificationStatus != 'NOT_APPLICABLE'}"
         th:text="${#messages.msg('notification.' + #strings.toLowerCase(notificationStatus))}"></div>
    <div class="alert alert-warning mb-3" th:if="${expenseLocked}" th:text="#{expense.monthLocked}">
        ※ 当月の月報は提出済みのため、交通費・諸経費の編集はロックされています。
    </div>
    <div class="alert alert-danger mb-3" th:if="${expenseErrorMessage}" th:text="${expenseErrorMessage}"></div>
    <div class="card">
        <h3 class="mb-4" th:text="#{page.travel-expense}">交通費入力</h3>
        
        <!-- 月選択セクション -->
        <div class="row mb-4">
            <div class="col-md-6">
                <form method="GET" action="/travel-expense" class="d-flex align-items-center">
                    <label for="year" class="me-2" th:text="#{common.year} + ':'">年度:</label>
                    <select name="year" id="year" class="form-select me-3" style="width: auto;">
                        <option value="">----</option>
                        <option th:each="year : ${availableYears}"
                                th:value="${year}"
                                th:text="${year}"
                                th:selected="${currentYear == year}">2023</option>
                    </select>
                    
                    <label for="month" class="me-2" th:text="#{common.month} + ':'">月度:</label>
                    <select name="month" id="month" class="form-select" style="width: auto;">
                        <option value="">--</option>
                        <option th:each="m : ${#numbers.sequence(1, 12)}"
                                th:value="${m}"
                                th:text="${m}"
                                th:selected="${currentMonth == m}">1</option>
                    </select>
                    
                    <button type="submit" class="btn btn-primary ms-3" th:text="#{common.show}">表示</button>
                </form>
            </div>
        </div>
        
        <!-- 非課税交通費 -->
        <div class="card mb-4 expense-section non-taxable">
            <div class="card-body">
                <h5 class="card-title" th:text="#{travel.nonTaxableTitle}">非課税交通費</h5>
                <p class="text-muted small mb-3" th:text="#{travel.nonTaxableHelp}">通勤等、非課税対象の交通費を入力してください。</p>
                <form method="POST" action="/travel-expense/save" th:object="${newNonTaxableExpense}">
                    <input type="hidden" th:field="*{type}">
                    <fieldset class="border-0 p-0 m-0" th:disabled="${expenseLocked}">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nonTaxableDate" th:text="#{travel.date}">日付</label>
                            <input type="date" id="nonTaxableDate" th:field="*{expenseDate}" required>
                        </div>
                        <div class="form-group">
                            <label for="nonTaxableTransportation" th:text="#{travel.transportation}">交通手段</label>
                            <input type="text" id="nonTaxableTransportation" th:field="*{transportation}" th:placeholder="#{travel.transportationPlaceholder}">
                        </div>
                        <div class="form-group">
                            <label for="nonTaxableRoute" th:text="#{travel.route}">ルート</label>
                            <input type="text" id="nonTaxableRoute" th:field="*{route}" th:placeholder="#{travel.routePlaceholder}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nonTaxableSummary" th:text="#{travel.description}">摘要</label>
                            <input type="text" id="nonTaxableSummary" th:field="*{summary}" th:placeholder="#{travel.summaryPlaceholder}">
                        </div>
                        <div class="form-group">
                            <label for="nonTaxableAmount" th:text="#{travel.amount}">金額</label>
                            <input type="number" id="nonTaxableAmount" th:field="*{amount}" placeholder="0" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add" th:text="#{travel.save}">追加</button>
                    </fieldset>
                </form>

                <div class="table-responsive">
                    <table class="table table-striped js-mobile-card-table">
                        <thead>
                            <tr>
                                <th th:text="#{travel.date}">日付</th>
                                <th th:text="#{travel.transportation}">交通手段</th>
                                <th th:text="#{travel.route}">ルート</th>
                                <th th:text="#{travel.description}">摘要</th>
                                <th th:text="#{travel.amount}">金額</th>
                                <th th:text="#{common.operation}">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${nonTaxableExpenses.empty}">
                                <td colspan="6" class="text-center" th:text="#{common.noData}">データがありません</td>
                            </tr>
                            <tr th:each="expense : ${nonTaxableExpenses}">
                                <td th:text="${#temporals.format(expense.expenseDate, 'yyyy/MM/dd')}">2023/01/01</td>
                                <td th:text="${expense.transportation}">電車</td>
                                <td th:text="${expense.route}">自宅→会社</td>
                                <td th:text="${expense.summary}">通勤</td>
                                <td th:text="|${#numbers.formatInteger(#objects.nullSafe(expense.amount, 0), 0, 'COMMA')}円|">1,000円</td>
                                <td>
                                    <form th:action="@{/travel-expense/delete/{id}(id=${expense.id})}" method="post" style="display:inline;" onsubmit="return confirm('削除してもよろしいですか？');">
                                        <button type="submit" class="btn-delete" th:text="#{common.delete}" th:disabled="${expenseLocked}">削除</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="section-total">
                    <span th:text="#{travel.nonTaxableSubtotal}">非課税交通費 小計</span>: <span th:text="|${#numbers.formatInteger(#objects.nullSafe(nonTaxableTotal, 0), 0, 'COMMA')}円|">0円</span>
                </div>
            </div>
        </div>

        <!-- 旅費交通費 -->
        <div class="card mb-4 expense-section travel">
            <div class="card-body">
                <h5 class="card-title" th:text="#{travel.travelTitle}">旅費交通費</h5>
                <p class="text-muted small mb-3" th:text="#{travel.travelHelp}">出張・外勤等、旅費として精算する交通費を入力してください。</p>
                <form method="POST" action="/travel-expense/save" th:object="${newTravelExpense}">
                    <input type="hidden" th:field="*{type}">
                    <fieldset class="border-0 p-0 m-0" th:disabled="${expenseLocked}">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="travelDate" th:text="#{travel.date}">日付</label>
                            <input type="date" id="travelDate" th:field="*{expenseDate}" required>
                        </div>
                        <div class="form-group">
                            <label for="travelTransportation" th:text="#{travel.transportation}">交通手段</label>
                            <input type="text" id="travelTransportation" th:field="*{transportation}" th:placeholder="#{travel.transportationPlaceholder}">
                        </div>
                        <div class="form-group">
                            <label for="travelRoute" th:text="#{travel.route}">ルート</label>
                            <input type="text" id="travelRoute" th:field="*{route}" th:placeholder="#{travel.routePlaceholderTravel}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="travelSummary" th:text="#{travel.description}">摘要</label>
                            <input type="text" id="travelSummary" th:field="*{summary}" th:placeholder="#{travel.summaryPlaceholder}">
                        </div>
                        <div class="form-group">
                            <label for="travelAmount" th:text="#{travel.amount}">金額</label>
                            <input type="number" id="travelAmount" th:field="*{amount}" placeholder="0" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add" th:text="#{travel.save}">追加</button>
                    </fieldset>
                </form>

                <div class="table-responsive">
                    <table class="table table-striped js-mobile-card-table">
                        <thead>
                            <tr>
                                <th th:text="#{travel.date}">日付</th>
                                <th th:text="#{travel.transportation}">交通手段</th>
                                <th th:text="#{travel.route}">ルート</th>
                                <th th:text="#{travel.description}">摘要</th>
                                <th th:text="#{travel.amount}">金額</th>
                                <th th:text="#{common.operation}">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${travelExpenses.empty}">
                                <td colspan="6" class="text-center" th:text="#{common.noData}">データがありません</td>
                            </tr>
                            <tr th:each="expense : ${travelExpenses}">
                                <td th:text="${#temporals.format(expense.expenseDate, 'yyyy/MM/dd')}">2023/01/01</td>
                                <td th:text="${expense.transportation}">電車</td>
                                <td th:text="${expense.route}">東京→大阪</td>
                                <td th:text="${expense.summary}">出張</td>
                                <td th:text="|${#numbers.formatInteger(#objects.nullSafe(expense.amount, 0), 0, 'COMMA')}円|">1,000円</td>
                                <td>
                                    <form th:action="@{/travel-expense/delete/{id}(id=${expense.id})}" method="post" style="display:inline;" onsubmit="return confirm('削除してもよろしいですか？');">
                                        <button type="submit" class="btn-delete" th:text="#{common.delete}" th:disabled="${expenseLocked}">削除</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="section-total">
                    <span th:text="#{common.travelSubtotal}">旅費交通費 小計</span>: <span th:text="|${#numbers.formatInteger(#objects.nullSafe(travelTotal, 0), 0, 'COMMA')}円|">0円</span>
                </div>
            </div>
        </div>
        
        <!-- 合計金額 -->
        <div class="grand-total">
            <div><span th:text="#{common.totalAmount}">合計金額</span>: <span class="total-amount" th:text="|${#numbers.formatInteger(#objects.nullSafe(totalAmount, 0), 0, 'COMMA')}円|">0円</span></div>
        </div>
    </div>
</th:block>
</body>
</html>
