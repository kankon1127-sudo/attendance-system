<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main-content}, 'travel-expense', '交通費入力')}">
<head th:fragment="head">
    <title>交通費入力 - 月次業務ポータル</title>
    <style>
        .expense-form {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: end;
        }
        .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2c3e50;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-add {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-add:hover {
            background: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-delete:hover {
            background: #c82333;
        }
        .total-section {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: right;
        }
        .total-amount {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .expense-section {
            border-left: 4px solid #3498db;
            padding-left: 0;
        }
        .expense-section.non-taxable {
            border-left-color: #28a745;
        }
        .expense-section.travel {
            border-left-color: #007bff;
        }
        .section-total {
            margin-top: 12px;
            text-align: right;
            font-weight: 600;
            color: #495057;
        }
        .grand-total {
            margin-top: 24px;
            padding: 18px;
            background: #e9ecef;
            border-radius: 8px;
            text-align: right;
        }
    </style>
</head>
<body>
<th:block th:fragment="main-content">
    <div class="card">
        <h3 class="mb-4">交通費入力</h3>
        
        <!-- 月選択セクション -->
        <div class="row mb-4">
            <div class="col-md-6">
                <form method="GET" action="/travel-expense" class="d-flex align-items-center">
                    <label for="year" class="me-2">年度:</label>
                    <select name="year" id="year" class="form-select me-3" style="width: auto;">
                        <option value="">----</option>
                        <option th:each="year : ${availableYears}"
                                th:value="${year}"
                                th:text="${year}"
                                th:selected="${currentYear == year}">2023</option>
                    </select>
                    
                    <label for="month" class="me-2">月度:</label>
                    <select name="month" id="month" class="form-select" style="width: auto;">
                        <option value="">--</option>
                        <option th:each="m : ${#numbers.sequence(1, 12)}"
                                th:value="${m}"
                                th:text="${m}"
                                th:selected="${currentMonth == m}">1</option>
                    </select>
                    
                    <button type="submit" class="btn btn-primary ms-3">表示</button>
                </form>
            </div>
        </div>
        
        <!-- 非課税交通費 -->
        <div class="card mb-4 expense-section non-taxable">
            <div class="card-body">
                <h5 class="card-title">非課税交通費</h5>
                <p class="text-muted small mb-3">通勤等、非課税対象の交通費を入力してください。</p>
                <form method="POST" action="/travel-expense/save" th:object="${newNonTaxableExpense}">
                    <input type="hidden" th:field="*{type}">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nonTaxableDate">日付</label>
                            <input type="date" id="nonTaxableDate" th:field="*{expenseDate}" required>
                        </div>
                        <div class="form-group">
                            <label for="nonTaxableTransportation">交通手段</label>
                            <input type="text" id="nonTaxableTransportation" th:field="*{transportation}" placeholder="例：電車、バス">
                        </div>
                        <div class="form-group">
                            <label for="nonTaxableRoute">ルート</label>
                            <input type="text" id="nonTaxableRoute" th:field="*{route}" placeholder="例：自宅→会社">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nonTaxableSummary">摘要</label>
                            <input type="text" id="nonTaxableSummary" th:field="*{summary}" placeholder="用途を記入">
                        </div>
                        <div class="form-group">
                            <label for="nonTaxableAmount">金額</label>
                            <input type="number" id="nonTaxableAmount" th:field="*{amount}" placeholder="0" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add">追加</button>
                </form>

                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>日付</th>
                                <th>交通手段</th>
                                <th>ルート</th>
                                <th>摘要</th>
                                <th>金額</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${nonTaxableExpenses.empty}">
                                <td colspan="6" class="text-center">データがありません</td>
                            </tr>
                            <tr th:each="expense : ${nonTaxableExpenses}">
                                <td th:text="${#temporals.format(expense.expenseDate, 'yyyy/MM/dd')}">2023/01/01</td>
                                <td th:text="${expense.transportation}">電車</td>
                                <td th:text="${expense.route}">自宅→会社</td>
                                <td th:text="${expense.summary}">通勤</td>
                                <td th:text="|${#numbers.formatInteger(#objects.nullSafe(expense.amount, 0), 0, 'COMMA')}円|">1,000円</td>
                                <td>
                                    <form th:action="@{/travel-expense/delete/{id}(id=${expense.id})}" method="post" style="display:inline;" onsubmit="return confirm('削除してもよろしいですか？');">
                                        <button type="submit" class="btn-delete">削除</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="section-total">
                    非課税交通費 小計: <span th:text="|${#numbers.formatInteger(#objects.nullSafe(nonTaxableTotal, 0), 0, 'COMMA')}円|">0円</span>
                </div>
            </div>
        </div>

        <!-- 旅費交通費 -->
        <div class="card mb-4 expense-section travel">
            <div class="card-body">
                <h5 class="card-title">旅費交通費</h5>
                <p class="text-muted small mb-3">出張・外勤等、旅費として精算する交通費を入力してください。</p>
                <form method="POST" action="/travel-expense/save" th:object="${newTravelExpense}">
                    <input type="hidden" th:field="*{type}">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="travelDate">日付</label>
                            <input type="date" id="travelDate" th:field="*{expenseDate}" required>
                        </div>
                        <div class="form-group">
                            <label for="travelTransportation">交通手段</label>
                            <input type="text" id="travelTransportation" th:field="*{transportation}" placeholder="例：電車、タクシー、新幹線">
                        </div>
                        <div class="form-group">
                            <label for="travelRoute">ルート</label>
                            <input type="text" id="travelRoute" th:field="*{route}" placeholder="例：東京→大阪">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="travelSummary">摘要</label>
                            <input type="text" id="travelSummary" th:field="*{summary}" placeholder="例：クライアント訪問">
                        </div>
                        <div class="form-group">
                            <label for="travelAmount">金額</label>
                            <input type="number" id="travelAmount" th:field="*{amount}" placeholder="0" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add">追加</button>
                </form>

                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>日付</th>
                                <th>交通手段</th>
                                <th>ルート</th>
                                <th>摘要</th>
                                <th>金額</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${travelExpenses.empty}">
                                <td colspan="6" class="text-center">データがありません</td>
                            </tr>
                            <tr th:each="expense : ${travelExpenses}">
                                <td th:text="${#temporals.format(expense.expenseDate, 'yyyy/MM/dd')}">2023/01/01</td>
                                <td th:text="${expense.transportation}">電車</td>
                                <td th:text="${expense.route}">東京→大阪</td>
                                <td th:text="${expense.summary}">出張</td>
                                <td th:text="|${#numbers.formatInteger(#objects.nullSafe(expense.amount, 0), 0, 'COMMA')}円|">1,000円</td>
                                <td>
                                    <form th:action="@{/travel-expense/delete/{id}(id=${expense.id})}" method="post" style="display:inline;" onsubmit="return confirm('削除してもよろしいですか？');">
                                        <button type="submit" class="btn-delete">削除</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="section-total">
                    旅費交通費 小計: <span th:text="|${#numbers.formatInteger(#objects.nullSafe(travelTotal, 0), 0, 'COMMA')}円|">0円</span>
                </div>
            </div>
        </div>
        
        <!-- 合計金額 -->
        <div class="grand-total">
            <div>合計金額: <span class="total-amount" th:text="|${#numbers.formatInteger(#objects.nullSafe(totalAmount, 0), 0, 'COMMA')}円|">0円</span></div>
        </div>
    </div>
</th:block>
</body>
</html>
