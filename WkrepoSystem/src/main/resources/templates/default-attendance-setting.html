<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main-content}, 'default-attendance-setting', 'デフォルト勤怠設定')}">
<head th:fragment="head">
    <title th:text="${#messages.msg('page.default-attendance-setting') + ' - ' + #messages.msg('brand.name')}">デフォルト勤怠設定</title>
</head>
<body>
<th:block th:fragment="main-content">
    <div class="card">
        <h4 class="mb-4" th:text="#{page.default-attendance-setting}">デフォルト勤怠設定</h4>

        <div th:if="${param.success}" class="alert alert-success" role="alert">
            <span th:text="#{settings.saved}">設定を保存しました。</span>
        </div>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <span th:text="#{settings.invalid}">入力内容が正しくありません。</span>
        </div>

        <form action="/default-attendance-setting/save" method="post">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label" th:text="#{attendance.startTime}">出勤時刻</label>
                    <input type="time" class="form-control" name="defaultStartTime"
                           th:value="${setting.defaultStartTime != null ? setting.defaultStartTime : '08:30'}">
                </div>
                <div class="col-md-6">
                    <label class="form-label" th:text="#{attendance.endTime}">退勤時刻</label>
                    <input type="time" class="form-control" name="defaultEndTime"
                           th:value="${setting.defaultEndTime != null ? setting.defaultEndTime : '18:00'}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label" th:text="#{attendance.breakTimeMinutes}">休憩時間（分）</label>
                    <input type="number" class="form-control" name="defaultBreakMinutes" min="0" max="600"
                           th:value="${setting.defaultBreakMinutes != null ? setting.defaultBreakMinutes : 60}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label" th:text="#{attendance.defaultStatus}">デフォルト区分</label>
                    <select class="form-select" name="defaultAgreement36Status">
                        <option value="在宅" th:selected="${setting.defaultAgreement36Status == '在宅' || setting.defaultAgreement36Status == null}" th:text="#{attendance.status.home}">在宅</option>
                        <option value="出社" th:selected="${setting.defaultAgreement36Status == '出社'}" th:text="#{attendance.status.office}">出社</option>
                        <option value="有給" th:selected="${setting.defaultAgreement36Status == '有給'}" th:text="#{attendance.status.paidLeave}">有給</option>
                        <option value="欠勤" th:selected="${setting.defaultAgreement36Status == '欠勤'}" th:text="#{attendance.status.absent}">欠勤</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" th:text="#{attendance.defaultApprover}">デフォルト承認依頼先</label>
                <input type="text" class="form-control" name="defaultApprover"
                       th:value="${setting.defaultApprover != null ? setting.defaultApprover : ''}"
                       th:placeholder="#{settings.approverPlaceholder}">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" th:text="#{action.save}">保存</button>
                <a href="/attendance" class="btn btn-secondary" th:text="#{action.back}">戻る</a>
            </div>
        </form>
    </div>
</th:block>
</body>
</html>
