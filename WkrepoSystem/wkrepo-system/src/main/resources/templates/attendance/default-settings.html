<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>默认勤怠设定</title>
</head>
<body>
<div class="modal">
    <div class="modal-header">
        <h4>デフォルト勤怠設定</h4>
        <button type="button" class="close">×</button>
    </div>
    <div class="modal-body">
        <form th:action="@{/default-attendance-settings}" method="post">
            <div class="form-group">
                <label>出勤時刻</label>
                <input type="time" name="workStartTime" th:value="${settings.workStartTime}" required/>
            </div>
            <div class="form-group">
                <label>退勤時刻</label>
                <input type="time" name="workEndTime" th:value="${settings.workEndTime}" required/>
            </div>
            <div class="form-group">
                <label>休憩時間（分）</label>
                <input type="number" name="breakTime" th:value="${settings.breakTime}" required/>
            </div>
            <div class="form-group">
                <label>デフォルト区分</label>
                <select name="defaultCategory" th:value="${settings.defaultCategory}">
                    <option value="在宅">在宅</option>
                    <option value="出張">出張</option>
                    <option value="出勤">出勤</option>
                </select>
            </div>
            <div class="form-group">
                <label>デフォルト承認依頼先</label>
                <select name="defaultApprover" th:value="${settings.defaultApprover}">
                    <option th:each="approver : ${approvers}" th:value="${approver.id}" th:text="${approver.name}"></option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="window.close()">キャンセル</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
